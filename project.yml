name: Galio
options:
  bundleIdPrefix: com.kpostaagasi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Galio:
    type: application
    platform: macOS
    sources:
      - path: Galio
        excludes:
          - "Resources/BundledData"
          - "Resources/BundledData/**"
          - "Resources/Mock"
          - "Resources/Mock/**"
      - path: Galio/Resources/BundledData
        type: folder
        buildPhase: resources
      - path: Galio/Resources/Mock
        type: folder
        buildPhase: resources
    info:
      path: Galio/Info.plist
      properties:
        CFBundleDisplayName: Galio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        LSApplicationCategoryType: public.app-category.games
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Galio is not endorsed by Riot Games."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSScreenCaptureUsageDescription: "Galio reads the three augment card titles on screen (on-device, never uploaded) to show their tiers."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kpostaagasi.galio
        PRODUCT_NAME: Galio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [GalioTests]
  GalioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GalioTests
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      - path: GalioTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Galio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kpostaagasi.galio.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Galio.app/Contents/MacOS/Galio"
        BUNDLE_LOADER: "$(TEST_HOST)"
