name: data

# Weekly rebuild of the recommendation data from Data Dragon / CommunityDragon + curated rules.
# Publishes data/<patch>/ (the app downloads it from raw.githubusercontent.com).
on:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build data
        run: python3 tools/build_data.py --bundle
      - name: Commit if changed
        run: |
          if git diff --quiet -- data Galio/Resources/BundledData && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "unchanged"; exit 0
          fi
          PATCH=$(python3 -c 'import json;print(json.load(open("data/manifest.json"))["latest"])')
          git config user.name "galio-data-bot"
          git config user.email "galio-data-bot@users.noreply.github.com"
          git add data Galio/Resources/BundledData
          git commit -m "Data: rebuild recommendation data for patch ${PATCH}"
          git push
