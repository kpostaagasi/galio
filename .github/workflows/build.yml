name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Localization catalog is in sync
        run: |
          python3 tools/l10n.py --check
          git diff --exit-code Galio/Resources/Localizable.xcstrings

      - name: Data pipeline tests
        run: python3 -m unittest tools/test_pipeline.py

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -project Galio.xcodeproj -scheme Galio -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 \
            | tee test.log | grep --line-buffered -E "Test Suite|Test Case.*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Build release app
        run: |
          set -o pipefail
          xcodebuild -project Galio.xcodeproj -scheme Galio -configuration Release -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tail -5
          APP=build/Build/Products/Release/Galio.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" Galio.zip
          ls -lh Galio.zip

      - name: Mock-game smoke test + screenshots (1024x768 and 1600x900)
        run: |
          APP=build/Build/Products/Release/Galio.app
          BID=com.kpostaagasi.galio
          shoot() {  # $1 = output dir
            local out="$1"; mkdir -p "$out"
            defaults delete "$BID" 2>/dev/null || true   # fresh window/overlay frames for this resolution
            for s in champselect champselect-locked ingame aram mayhem arena postgame; do
              open -n "$APP" --args --mock-game "$s"
              sleep 9
              pgrep -x Galio > /dev/null || { echo "Galio did not stay running for $s"; exit 1; }
              screencapture -x "$out/$s.png" || echo "screencapture unavailable for $s"
              pkill -x Galio || true
              sleep 2
            done
            # Expanded overlay variant (the default is the collapsed overlay).
            defaults write "$BID" overlayExpanded -bool true
            open -n "$APP" --args --mock-game ingame
            sleep 9; screencapture -x "$out/ingame-expanded.png" || true; pkill -x Galio || true; sleep 2
            defaults write "$BID" overlayExpanded -bool false
            # Main-window sections: history (filled by the postgame run above) and the champion browser.
            open -n "$APP" --args --mock-game postgame --show history
            sleep 8; screencapture -x "$out/history.png" || true; pkill -x Galio || true; sleep 2
            open -n "$APP" --args --mock-game champselect --show champions --select-champion Galio
            sleep 10; screencapture -x "$out/champions.png" || true; pkill -x Galio || true; sleep 2
            open -n "$APP" --args --mock-game champselect --show about
            sleep 6; screencapture -x "$out/about.png" || true; pkill -x Galio || true; sleep 2
          }
          system_profiler SPDisplaysDataType | grep -i -E "resolution|display type" || true
          shoot screenshots/1024x768
          # Second pass on a larger display. The runner's virtual display has no 1440x900 mode; 1600x900
          # (same height, closest width) is the nearest one it offers.
          brew install displayplacer > /dev/null 2>&1 || true
          if command -v displayplacer > /dev/null; then
            displayplacer list | tee displays.txt | grep -E "Persistent screen id|Resolution:" || true
            SID=$(grep -m1 "Persistent screen id" displays.txt | awk '{print $4}')
            MODE=$(grep -E "res:1440x900 |res:1600x900 " displays.txt | head -1 | sed -E 's/^ *mode ([0-9]+):.*/\1/')
            if [ -n "$SID" ] && [ -n "$MODE" ]; then
              displayplacer "id:$SID mode:$MODE" || true
            elif [ -n "$SID" ]; then
              echo "no 1440x900/1600x900 mode"
            fi
            sleep 3
          fi
          system_profiler SPDisplaysDataType | grep -i "resolution" || true
          RES=$(displayplacer list 2>/dev/null | awk '/^Resolution:/{print $2; exit}')
          shoot "screenshots/${RES:-second}"
          ls -lR screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Galio-${{ github.sha }}
          path: |
            Galio.zip
            screenshots/
            displays.txt
            test.log
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Galio.zip --title "Galio ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md
